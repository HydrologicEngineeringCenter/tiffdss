name: tiffdss-stack

services:
  tiffdss:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HECDSS_VERSION=master
        - DSSVUE_VERSION=main
        - GDAL_VERSION=ubuntu-full-3.7.0
        - DSS_UBUNTU_VERSION=20.04
    container_name: tiffdss
    # entrypoint: "sleep infinity"
    command: ["build", "alive"]
    volumes:
      - ./output:/tiffdss/output
